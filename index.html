<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e0f2f1">
  <title>Consulte a Situação Cadastral</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap { width: 100%; max-width: 420px; }
    .card {
      width: 100%;
      min-height: 394px;
      padding: 54px 22px 48px;
      border: 1px solid #a9dfdc;
      border-radius: 11px;
      background: #e0f2f1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin: 0 0 16px;
      color: #005548;
      font-size: clamp(25px, 6vw, 30px);
      line-height: 1.55;
      font-weight: 700;
    }
    p {
      margin: 0 0 28px;
      color: #666666;
      font-size: clamp(17px, 4.3vw, 20px);
      line-height: 1.55;
      font-weight: 400;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 67px;
      min-width: 200px;
      max-width: 100%;
      padding: 14px 34px;
      border-radius: 999px;
      background: #008577;
      color: #ffffff;
      text-decoration: none;
      font-size: 21px;
      font-weight: 700;
      box-shadow: 0 4px 8px rgba(0,0,0,.16);
      -webkit-tap-highlight-color: transparent;
      transition: background .15s ease, transform .15s ease;
    }
    .button:hover { background: #006f64; }
    .button:active { transform: translateY(1px); }
    .disclosure {
      margin: 12px 8px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }
    @media (max-width: 360px) {
      .card { min-height: 370px; padding: 36px 17px; }
      .button { min-height: 58px; font-size: 19px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="titulo">
      <h1 id="titulo">Consulte a Situação<br>Cadastral</h1>
      <p>Verifique o status do seu CNPJ MEI e certifique-se de que sua conta está pronta.</p>
      <a class="button"
         href="https://gov.empreendedormeibr.org/index.html"
         target="_blank"
         rel="noopener noreferrer">Verificar MEI</a>
    </section>
    <p class="disclosure">Aviso: este link direciona para um site externo e não representa, por si só, um canal oficial do Governo Federal.</p>
  </main>
</body>
</html>
